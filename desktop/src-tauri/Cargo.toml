[package]
name = "kesher_desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.1.1", features = [] }

# Audio capture / playback
cpal = "0.15"

# Opus codec (C-based via bindgen, requires MSVC or MinGW on Windows)
opus = "0.3"

# Async runtime (needed by webrtc-rs)
tokio = { version = "1", features = ["full"] }

# WebRTC transport (Pion-compatible)
webrtc = "0.12"

# bytes::Bytes is required by webrtc::media::Sample
bytes = "1"

# Logging
log = "0.4"
env_logger = "0.11"

[features]
default = []
