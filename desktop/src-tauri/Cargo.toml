[package]
name = "kesher_desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.1.1", features = [] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "windows")'.dependencies]
# Native audio pipeline dependencies are compiled only on Windows.
cpal = "0.15"
opus = "0.3"
webrtc = "0.12"
bytes = "1"
