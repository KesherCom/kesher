  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="512" height="512" rx="112" fill="url(#glow)" />
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />
  <!-- Verbindungen: ein Punkt zu zwei Punkten -->
  <path d="M124 256C227 256 288 192 388 152" fill="none" stroke="url(#armTop)" stroke-linecap="round" stroke-width="39" />
  <path d="M124 256C227 256 288 320 388 360" fill="none" stroke="url(#armBottom)" stroke-linecap="round" stroke-width="39" />
  <!-- Punkte -->
  <circle cx="124" cy="256" r="80" fill="#f9fafb" fill-opacity="0.12" />
  <circle cx="124" cy="256" r="70" fill="url(#hub)" />
  <circle cx="388" cy="152" r="70" fill="url(#nodeTop)" />
  <circle cx="388" cy="360" r="70" fill="url(#nodeBottom)" />
