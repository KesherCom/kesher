# kesher — HTTPS with a self-signed certificate (LAN, no domain needed).
#
#   cp deploy/compose/.env.example deploy/compose/.env   # set KESHER_PUBLIC_IP!
#   docker compose -f deploy/compose/docker-compose.selfsigned.yml up -d --build
#
# Open https://<KESHER_PUBLIC_IP>:8443 and accept the certificate warning once
# per device. The certificate is generated on first start and kept in the
# kesher_certs volume (delete the volume to regenerate it, e.g. after changing
# KESHER_PUBLIC_IP).
name: kesher-selfsigned

services:
  kesher:
    image: ${KESHER_IMAGE_SELFSIGNED:-kesher:local-selfsigned}
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
      target: selfsigned
      args:
        VERSION: ${KESHER_VERSION:-dev}
    container_name: kesher-selfsigned
    ports:
      - "${KESHER_HTTPS_PORT:-8443}:8443/tcp"
      - "${KESHER_NATIVE_UDP_PORT:-8081}:${KESHER_NATIVE_UDP_PORT:-8081}/udp"
      - "${KESHER_WEBRTC_UDP_PORT:-8082}:${KESHER_WEBRTC_UDP_PORT:-8082}/udp"
    environment:
      ADMIN_PIN: ${ADMIN_PIN:-123456}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-720}
      CERT_HOST: ${KESHER_PUBLIC_IP:-localhost}
      # Extra SAN entries, e.g. "DNS:intercom.local,IP:10.0.0.5"
      CERT_EXTRA_SAN: ${CERT_EXTRA_SAN:-}
      CERT_DAYS: ${CERT_DAYS:-825}
      UDP_AUDIO_ADDR: ":${KESHER_NATIVE_UDP_PORT:-8081}"
      UDP_AUDIO_ADVERTISE_IP: ${KESHER_PUBLIC_IP:-}
      WEBRTC_UDP_PORT: ${KESHER_WEBRTC_UDP_PORT:-8082}
      WEBRTC_PUBLIC_IPS: ${KESHER_PUBLIC_IP:-127.0.0.1}
    volumes:
      - kesher_data:/app/data
      - kesher_certs:/app/certs
    init: true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  kesher_data:
  kesher_certs:
