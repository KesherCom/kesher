# kesher — plain HTTP on a trusted LAN (default deployment).
#
#   cp deploy/compose/.env.example deploy/compose/.env   # set KESHER_PUBLIC_IP!
#   docker compose -f deploy/compose/docker-compose.yml up -d --build
#
# Browsers only allow microphone access on http:// for localhost. LAN clients
# on plain HTTP need the desktop app/proxy or one of the HTTPS variants
# (docker-compose.selfsigned.yml, docker-compose.certmagic.yml).
name: kesher

services:
  kesher:
    image: ${KESHER_IMAGE:-kesher:local}
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
      target: runtime
      args:
        VERSION: ${KESHER_VERSION:-dev}
    container_name: kesher
    ports:
      - "${KESHER_HTTP_PORT:-8080}:8080/tcp"
      # UDP ports must be identical on host and container: the server
      # advertises its own port number to clients.
      - "${KESHER_NATIVE_UDP_PORT:-8081}:${KESHER_NATIVE_UDP_PORT:-8081}/udp"
      - "${KESHER_WEBRTC_UDP_PORT:-8082}:${KESHER_WEBRTC_UDP_PORT:-8082}/udp"
    environment:
      TRUSTED_LAN_HTTP: "true"
      ADMIN_PIN: ${ADMIN_PIN:-123456}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-720}
      UDP_AUDIO_ADDR: ":${KESHER_NATIVE_UDP_PORT:-8081}"
      UDP_AUDIO_ADVERTISE_IP: ${KESHER_PUBLIC_IP:-}
      WEBRTC_UDP_PORT: ${KESHER_WEBRTC_UDP_PORT:-8082}
      WEBRTC_PUBLIC_IPS: ${KESHER_PUBLIC_IP:-127.0.0.1}
    volumes:
      - kesher_data:/app/data
    init: true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  kesher_data:
