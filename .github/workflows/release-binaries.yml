name: Release binaries

# Builds everything (server, Pi/Linux node, Windows and macOS desktop):
# - tag v*: build and publish a GitHub release
# - manual run (Actions -> Release binaries -> Run workflow): build only
# - push with "[full-build]" in the commit message: build only, so a branch
#   can be checked end to end without releasing (artifacts on the run page)
on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
  workflow_dispatch:
permissions:
  contents: write

env:
  # The opus crate (audiopus_sys) builds the bundled libopus with
  # cmake_minimum_required(VERSION 3.1), which CMake 4 (on the runners)
  # rejects; this lets CMake 4 configure it. Used where Opus is built from
  # source (Windows desktop).
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  # 1. Backend & Web CI/Release
  build:
    if: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[full-build]') }}
    name: Build Backend ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    env:
      GO_VERSION: "1.25.x"
      NODE_VERSION: "22"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        # npm 10 (bundled with Node 22) crashes on this workspace's peer deps
        # ("reading 'edgesOut'"); npm 11 resolves them.
        run: |
          npm install -g npm@11
          npm install

      - name: Build web UI
        run: npm --prefix web run build

      - name: Embed web UI into backend
        run: |
          rm -rf backend/internal/app/embedded_web
          mkdir -p backend/internal/app/embedded_web
          cp -R web/dist/. backend/internal/app/embedded_web/

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Build backend binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist/bin dist/packages
          BUILD_TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          bin="kesher-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          package_base="kesher-server-${{ matrix.goos }}-${{ matrix.goarch }}"
          cd backend
          go build -trimpath -ldflags="-s -w -X github.com/KesherCom/kesher/backend/internal/app.Version=${VERSION} -X github.com/KesherCom/kesher/backend/internal/app.BuildTimestamp=${BUILD_TIMESTAMP}" -o "../dist/bin/${bin}" ./cmd/server
          cd ..
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -j "dist/packages/${package_base}.zip" "dist/bin/${bin}"
          else
            tar -czf "dist/packages/${package_base}.tar.gz" -C dist/bin "${bin}"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/packages/*

  # 1a. Raspberry Pi / Linux node (.deb + tar.gz), built in the same
  # container as `make node-deb`.
  build-node:
    if: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[full-build]') }}
    name: Build Node ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build package
        run: |
          docker build -t kesher-node-build -f deploy/node/Dockerfile deploy/node
          version="${GITHUB_REF_NAME#v}"
          case "$version" in [0-9]*) ;; *) version="" ;; esac
          docker run --rm -v "$PWD:/src" -e KESHER_VERSION="$version" kesher-node-build ${{ matrix.arch }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: node-${{ matrix.arch }}
          path: |
            dist/node/*.deb
            dist/node/*.tar.gz

  # 1b. Fast Desktop Validation (runs on every push/tag/dispatch)
  desktop-check:
    if: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[full-build]') }}
    name: Desktop Check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install Dependencies
        # npm 10 (bundled with Node 22) crashes on this workspace's peer deps
        # ("reading 'edgesOut'"); npm 11 resolves them.
        run: |
          npm install -g npm@11
          npm install

      - name: Desktop web check
        run: npm --prefix desktop run build:web

      - name: Desktop native check
        run: |
          cargo test -p kesher-audio
          cd desktop/src-tauri
          cargo check

  # 2. Windows Desktop
  build-desktop-windows:
    if: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[full-build]') }}
    name: Build Desktop (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build
        run: |
          npm install -g npm@11
          npm install
          node scripts/set-desktop-version.mjs
          npm --prefix desktop run tauri build -- --bundles nsis,msi

      - name: Prepare release assets
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist/release | Out-Null
          $msi = Get-ChildItem -Path "target/release/bundle/msi/*.msi", "target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          $exe = Get-ChildItem -Path "target/release/bundle/nsis/*.exe", "target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msi) { throw "Windows MSI bundle not found" }
          if (-not $exe) { throw "Windows NSIS bundle not found" }
          Copy-Item $msi.FullName "dist/release/kesher-desktop-windows-amd64.msi"
          Copy-Item $exe.FullName "dist/release/kesher-desktop-windows-amd64-setup.exe"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: dist/release/*
          if-no-files-found: error

# 3. macOS Desktop (Apple Silicon)
  build-desktop-macos-arm64:
    if: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[full-build]') }}
    name: Build Desktop (macOS arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install Opus toolchain
        run: |
          brew install opus pkg-config
          echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
      - name: Configure macOS signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi
      - name: Build
        run: |
          npm install -g npm@11
          npm install
          node scripts/set-desktop-version.mjs
          npm --prefix desktop run tauri build -- --target aarch64-apple-darwin
      - name: Prepare release assets
        run: |
          mkdir -p dist/release
          dmg="$(find target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -n 1)"
          if [ -z "$dmg" ]; then
            echo "macOS arm64 DMG bundle not found" >&2
            exit 1
          fi
          cp "$dmg" dist/release/kesher-desktop-macos-arm64.dmg
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-arm64
          path: dist/release/*
          if-no-files-found: error

  # 4. macOS Desktop (Intel)
  build-desktop-macos-amd64:
    if: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[full-build]') }}
    name: Build Desktop (macOS amd64)
    # macos-13 was retired; macos-15-intel is the remaining Intel image.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install Opus toolchain
        run: |
          brew install opus pkg-config
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
      - name: Configure macOS signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi
      - name: Build
        run: |
          npm install -g npm@11
          npm install
          node scripts/set-desktop-version.mjs
          npm --prefix desktop run tauri build -- --target x86_64-apple-darwin
      - name: Prepare release assets
        run: |
          mkdir -p dist/release
          dmg="$(find target/x86_64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -n 1)"
          if [ -z "$dmg" ]; then
            echo "macOS amd64 DMG bundle not found" >&2
            exit 1
          fi
          cp "$dmg" dist/release/kesher-desktop-macos-amd64.dmg
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-amd64
          path: dist/release/*
          if-no-files-found: error

  # 5. Release (Nur bei Tags!)
  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      [
        build,
        build-node,
        build-desktop-windows,
        build-desktop-macos-arm64,
        build-desktop-macos-amd64,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Download All
        uses: actions/download-artifact@v8
        with:
          path: all-assets
          merge-multiple: true

      # Release text: docs/releases/<version>.md (if written) followed by
      # the download table (docs/releases/downloads.md), then GitHub's
      # generated list of changes.
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="docs/releases/${version}.md"
          : > release-body.md
          if [ -f "$notes_file" ]; then
            cat "$notes_file" >> release-body.md
            echo >> release-body.md
          fi
          cat docs/releases/downloads.md >> release-body.md

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "all-assets/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          bodyFile: release-body.md
          generateReleaseNotes: true
