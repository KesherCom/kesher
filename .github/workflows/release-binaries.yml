name: Release binaries

on:
  push:
    branches: ["main", "dev"]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Backend & Web CI/Release
  build:
    name: Build Backend ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    env:
      GO_VERSION: "1.25.x"
      NODE_VERSION: "22"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: npm install

      - name: Build web UI
        run: npm --prefix web run build

      - name: Embed web UI into backend
        run: |
          rm -rf backend/internal/app/embedded_web
          mkdir -p backend/internal/app/embedded_web
          cp -R web/dist/. backend/internal/app/embedded_web/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Build backend binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/bin dist/packages
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          bin="kesher-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          cd backend
          go build -trimpath -ldflags="-s -w" -o "../dist/bin/${bin}" ./cmd/server
          cd ..
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -j "dist/packages/kesher-${{ matrix.goos }}-${{ matrix.goarch }}.zip" "dist/bin/${bin}"
          else
            tar -czf "dist/packages/kesher-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" -C dist/bin "${bin}"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/packages/*

  # 1b. Fast Desktop Validation (runs on every push/tag/dispatch)
  desktop-check:
    name: Desktop Check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install Dependencies
        run: npm install

      - name: Desktop web check
        run: npm --prefix desktop run build:web

      - name: Desktop native check
        run: |
          cd desktop/src-tauri
          cargo check

  # 2. Windows Desktop
  build-desktop-windows:
    name: Build Desktop (Windows)
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Build
        run: |
          npm install
          npm --prefix desktop run tauri build

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe

  # 3. macOS Desktop
  build-desktop-macos:
    name: Build Desktop (macOS)
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install Opus toolchain
        run: |
          brew install opus pkg-config
          echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"

      - name: Build
        run: |
          npm install
          npm --prefix desktop run tauri build -- --target aarch64-apple-darwin

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/dmg/*.dmg

  # 4. Release (Nur bei Tags!)
  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build-desktop-windows, build-desktop-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download All
        uses: actions/download-artifact@v4
        with:
          path: all-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "all-assets/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
