name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    env:
      GO_VERSION: "1.25.x"
      NODE_VERSION: "22"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Embed web UI into backend
        run: |
          rm -rf backend/internal/app/embedded_web
          mkdir -p backend/internal/app/embedded_web
          cp -R web/dist/. backend/internal/app/embedded_web/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Build backend binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/bin dist/packages
          ext=""
          if [ "${GOOS}" = "windows" ]; then ext=".exe"; fi
          bin="kesher-${GOOS}-${GOARCH}${ext}"
          archive="kesher-${GOOS}-${GOARCH}"

          (
            cd backend
            go build -trimpath -ldflags="-s -w" -o "../dist/bin/${bin}" ./cmd/server
          )

          if [ "${GOOS}" = "windows" ]; then
            (
              cd dist/bin
              zip -9 "../packages/${archive}.zip" "${bin}"
            )
          else
            tar -C dist/bin -czf "dist/packages/${archive}.tar.gz" "${bin}"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/packages/*
          if-no-files-found: error

  release:
    name: Publish GitHub release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create release and upload assets
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "release-artifacts/*"
          generateReleaseNotes: true
