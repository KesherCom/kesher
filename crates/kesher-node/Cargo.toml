[package]
name = "kesher-node"
version = "0.1.0"
description = "Headless Kesher intercom station (Raspberry Pi and other Linux devices)"
edition.workspace = true
repository.workspace = true

[dependencies]
kesher-audio = { path = "../kesher-audio" }
cpal = "0.15"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util"] }
# WebSocket over our own TCP/TLS stream (no TLS features needed here).
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# TLS with ring: no OpenSSL or cmake/nasm needed on the build host.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
# GPIO character device; finds lines by name, so Pi 3/4/5 all work.
gpiocdev = "0.7"
